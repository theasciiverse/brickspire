[package]
name = "brickspire"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", optional = true }
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
